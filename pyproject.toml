[project]
name = "at2-weather-api"
version = "1.0.0"
description = "FastAPI service serving Climate Comfort Index and Weather Hazard Category predictions (UTS 36120 AT2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.139.0",
    "uvicorn==0.50.0",
    "pandas==2.2.3",
    "scikit-learn==1.9.1",
    "joblib==1.5.3",
    "mykrml-25740287",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
mykrml-25740287 = { index = "testpypi" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
